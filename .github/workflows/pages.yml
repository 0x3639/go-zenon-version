name: Publish dashboard
on:
  push:
    branches: [main]
    paths-ignore: ['backend/**', '*.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v6
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_DISCOVERY_API_URL: ${{ vars.DISCOVERY_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    container: node:24-bookworm
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
