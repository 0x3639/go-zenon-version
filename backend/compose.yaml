services:
  discovery:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://0x3639.github.io}"
      SCAN_INTERVAL: "${SCAN_INTERVAL:-10m}"
      SCAN_BUDGET: "${SCAN_BUDGET:-3m}"
      MAX_NODES: "${MAX_NODES:-256}"
      CONCURRENCY: "${CONCURRENCY:-4}"
      SEED_URLS: "${SEED_URLS:-wss://my.hc1node.com:35998,wss://node.zenonhub.io:35998,wss://node.atsocy.com:35998}"
    volumes:
      - discovery-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    pids_limit: 256
    mem_limit: 512m
volumes:
  discovery-data:
